name: "Terraform Apply (manual)"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to apply (dev/staging/prod)'
        required: true
        default: 'dev'

jobs:
  apply:
    name: Plan and Apply (manual)
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4

      - name: Debug GitHub context
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "Workflow Ref: ${{ github.workflow_ref }}"
          echo "Event: ${{ github.event_name }}"
          echo "Environment: ${{ github.event.inputs.environment }}"

      - name: Print OIDC claims
        shell: bash
        run: |
          TOKEN=$(curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value')

          echo "================ JWT CLAIMS ================"
          echo "$TOKEN" | cut -d '.' -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq || true
          echo "============================================"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Verify AWS credentials
        run: |
          echo "Region:"
          echo "$AWS_REGION"

          echo
          echo "Caller identity:"
          aws sts get-caller-identity

          echo
          echo "Credential source:"
          aws configure list

      - name: Terraform init
        run: |
          cd infra/terraform/environments/${{ github.event.inputs.environment }}
          terraform init -input=false

      - name: Terraform plan
        run: |
          cd infra/terraform/environments/${{ github.event.inputs.environment }}
          terraform plan -out=plan.tfplan

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: infra/terraform/environments/${{ github.event.inputs.environment }}/plan.tfplan

      - name: Terraform apply
        if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'dev'
        run: |
          cd infra/terraform/environments/${{ github.event.inputs.environment }}
          terraform apply -input=false -auto-approve plan.tfplan
