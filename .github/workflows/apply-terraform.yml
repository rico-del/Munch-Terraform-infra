name: "Terraform Apply (manual)"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to apply (dev/staging/prod)'
        required: true
        default: 'dev'

jobs:
  apply:
    name: Plan and Apply (manual)
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Terraform init
        run: |
          cd infra/terraform/environments/${{ github.event.inputs.environment }}
          terraform init -input=false

      - name: Terraform plan
        run: |
          cd infra/terraform/environments/${{ github.event.inputs.environment }}
          terraform plan -out=plan.tfplan

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: infra/terraform/environments/${{ github.event.inputs.environment }}/plan.tfplan

      - name: Terraform apply
        if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'dev'
        run: |
          cd infra/terraform/environments/${{ github.event.inputs.environment }}
          terraform apply -input=false -auto-approve plan.tfplan
