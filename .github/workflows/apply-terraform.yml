name: "Terraform Apply (manual)"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to apply (dev/staging/prod)'
        required: true
        default: 'dev'

jobs:
  apply:
    name: Plan and Apply (manual)
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    permissions:
      contents: read
      id-token: write

    env:
      TF_VAR_aws_region: ${{ vars.TF_VAR_aws_region }}
      TF_VAR_environment: ${{ vars.TF_VAR_environment }}
      TF_VAR_owner: ${{ vars.TF_VAR_owner }}
      TF_VAR_dry_run_mode: ${{ vars.TF_VAR_dry_run_mode }}
      TF_VAR_vpc_cidr: ${{ vars.TF_VAR_vpc_cidr }}
      TF_VAR_public_subnet_cidr: ${{ vars.TF_VAR_public_subnet_cidr }}
      TF_VAR_private_subnet_cidr: ${{ vars.TF_VAR_private_subnet_cidr }}
      TF_VAR_enable_nat_gateway: ${{ vars.TF_VAR_enable_nat_gateway }}
      TF_VAR_assign_public_ip: ${{ vars.TF_VAR_assign_public_ip }}
      TF_VAR_enable_public_ssh: ${{ vars.TF_VAR_enable_public_ssh }}
      TF_VAR_use_ssm: ${{ vars.TF_VAR_use_ssm }}
      TF_VAR_open_app_ports: ${{ vars.TF_VAR_open_app_ports }}
      TF_VAR_instance_type: ${{ vars.TF_VAR_instance_type }}
      TF_VAR_cpu_credits: ${{ vars.TF_VAR_cpu_credits }}
      TF_VAR_ubuntu_release: ${{ vars.TF_VAR_ubuntu_release }}
      TF_VAR_root_volume_size_gb: ${{ vars.TF_VAR_root_volume_size_gb }}
      TF_VAR_root_volume_type: ${{ vars.TF_VAR_root_volume_type }}
      TF_VAR_create_kms_key: ${{ vars.TF_VAR_create_kms_key }}
      TF_VAR_enable_cloudwatch_agent: ${{ vars.TF_VAR_enable_cloudwatch_agent }}
      TF_VAR_cloudwatch_log_retention_days: ${{ vars.TF_VAR_cloudwatch_log_retention_days }}
      TF_VAR_app_directory: ${{ vars.TF_VAR_app_directory }}
      TF_VAR_ssm_parameter_prefix: ${{ vars.TF_VAR_ssm_parameter_prefix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4

      - name: Debug GitHub context
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "Workflow Ref: ${{ github.workflow_ref }}"
          echo "Event: ${{ github.event_name }}"
          echo "Environment: ${{ github.event.inputs.environment }}"

      - name: Print OIDC claims
        shell: bash
        run: |
          TOKEN=$(curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value')

          echo "================ JWT CLAIMS ================"
          echo "$TOKEN" | cut -d '.' -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq || true
          echo "============================================"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Verify AWS credentials
        run: |
          echo "Region:"
          echo "$AWS_REGION"

          echo
          echo "Caller identity:"
          aws sts get-caller-identity

          echo
          echo "Credential source:"
          aws configure list

      - name: Terraform init
        run: |
          cd infra/terraform/environments/${{ github.event.inputs.environment }}
          terraform init -input=false

      - name: Terraform plan
        run: |
          cd infra/terraform/environments/${{ github.event.inputs.environment }}
          terraform plan -out=plan.tfplan

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: infra/terraform/environments/${{ github.event.inputs.environment }}/plan.tfplan

      - name: Terraform apply
        if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'dev'
        run: |
          cd infra/terraform/environments/${{ github.event.inputs.environment }}
          terraform apply -input=false -auto-approve plan.tfplan
