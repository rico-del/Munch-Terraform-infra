name: "Terraform Apply (manual)"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to apply (dev/staging/prod)'
        required: true
        default: 'dev'

jobs:
  apply:
    name: Plan and Apply (manual)
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    permissions:
      contents: read
      id-token: write


    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Debug GitHub context
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "Workflow Ref: ${{ github.workflow_ref }}"
          echo "Event: ${{ github.event_name }}"
          echo "Environment: ${{ github.event.inputs.environment }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Terraform init
        run: |
          cd infra/terraform/environments/${{ github.event.inputs.environment }}
          terraform init -input=false

      - name: Terraform plan
        run: |
          cd infra/terraform/environments/${{ github.event.inputs.environment }}
          terraform plan -out=plan.tfplan

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: infra/terraform/environments/${{ github.event.inputs.environment }}/plan.tfplan

      - name: Terraform apply
        if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'dev'
        run: |
          cd infra/terraform/environments/${{ github.event.inputs.environment }}
          terraform apply -input=false -auto-approve plan.tfplan
